@if (isLoading$ | async) {
  <div class="card">
    <p-table [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template #header>
        <tr>
          <th>Title</th>
          <th>Tags</th>
          <th>View</th>
        </tr>
      </ng-template>
      <ng-template #body>
        <tr>
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
        </tr>
      </ng-template>
    </p-table>
  </div>
} @else {
  <div class="p-table">
    <p-contextMenu [model]="menuItems" #contextMenu></p-contextMenu>
    <p-table
      [totalRecords]="totalRecords"
      [paginator]="true"
      [first]="firstNumber"
      [rows]="pageSize"
      [contextMenu]="contextMenu"
      [value]="(posts$ | async) ?? []"
      [tableStyle]="{ 'min-width': '50rem' }"
      (onPage)="onPageChange($event)"
      [rowsPerPageOptions]="[10, 20, 50]"
      [lazy]="true"
      [(contextMenuSelection)]="selectedPost"
      (onRowClick)="onRowSelect($event)"
    >
      <ng-template #header>
        <tr>
          <th>Title</th>
          <th>Tags</th>
          <th>View</th>
        </tr>
      </ng-template>
      <ng-template #body let-post>
        <tr (dblclick)="openPost(post)" [pContextMenuRow]="post" style="cursor: pointer;">
          <td>{{ post.title }}</td>
          <td>{{ post.tags.join(', ') }}</td>
          <td>{{ post.views }}</td>
        </tr>
      </ng-template>
    </p-table>
    <button id="create-post" class="create-posts-btn" routerLink="/posts/create">Создать пост</button>
  </div>
}
