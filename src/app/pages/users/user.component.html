<section class="users-page">
  <h1 class="users-title">Список Пользователей</h1>

  <app-users-filter (filterChange)="onFilterChange($event)"></app-users-filter>

  <app-user-create (createUser)="onCreateUser($event)"></app-user-create>

  <div class="users-list">
    @for (user of (filteredUsers$ | async); track user.id) {
    <app-user-card [user]="user" (deleteUser)="onDeleteUser($event)"></app-user-card>
    } @empty {
    <div class="no-users">Нет пользователей для отображения</div>
    }
  </div>
</section>
