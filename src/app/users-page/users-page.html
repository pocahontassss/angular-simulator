<section class="user-page">
  <h1 class="user-page__title">Список Пользователей</h1>
  <div class="user-page__grid">
    @for (user of (filteredUsers$ | async); track user.id) {
      <app-user-card [user]="user" (deleteUser)="onDeleteUser($event)"></app-user-card>
    } @empty {
      <div class="not-found-users">
        Нет пользователей для отображения
      </div>
    }
    <app-user-create (createUser)="onCreateUser($event)"></app-user-create>
    <app-user-filter (filterChange)="onFilterChange($event)"></app-user-filter>
  </div>
</section>
