<header class="header">
  <div class="header__top">
    <a href="/" class="logo">
      <img src="/images/logo-mount-icon.svg" class="logo__img" alt="Логотип в форме горы">
      <span class="logo__text">{{ companyName }}</span>
    </a>
    <nav class="nav">
      <ul class="nav__list">
        <li><a href="/">Главная</a></li>
        <li><a href="/">Про гида</a></li>
        <li><a href="/">Программа тура</a></li>
        <li><a href="/">Стоимость</a></li>
        <li><a href="/">Блог</a></li>
        <li><a href="/">Контакты</a></li>
      </ul>
    </nav>
    <a href="/" class="header__top-btn">Консультация</a>
  </div>
  <div class="header__bottom">
    <h1 class="header__bottom-slogan">Насладись прогулкой в горах<br>с командой единомышленников</h1>
    <form class="tour__search">
      <div class="tour__search-field">
        <button class="tour__search-select" type="button">Локация для тура<img src="/images/arrow-down-icon.svg"></button>
        <p>выберите из списка</p>
      </div>
      
      <div class="tour__search-field">
        <button class="tour__search-select" type="button">Дата похода<img src="/images/calendar-icon.svg"></button>
        <p>укажите дату</p>
      </div>
      
      <div class="tour__search-field">
        <button class="tour__search-select" type="button">Участники<img src="/images/arrow-down-icon.svg"></button>
        <p>выберите из списка</p>
      </div>
      
      <button class="tour__search-btn" type="submit">
        Найти программу
      </button>
    </form>
  </div>
</header>
