<header class="header">
  <div class="container">
    <div class="header-info">
      <div class="header-logo">
        <img class="logo" src="/images/mountain-icon.svg" alt="mountain">
        <span class="company-name">{{ companyName }}</span>
      </div>
      <nav class="header-nav">
        <a href="#">Главная</a>
        <a href="#">Про гида</a>
        <a href="#">Программа тура</a>
        <a href="#">Стоимость</a>
        <a href="#">Блог</a>
        <a href="#">Контакты</a>
      </nav>
      <button class="consult-btn">Консультация</button>
    </div>
  </div>
</header>

<section class="main-info-section">
  <div class="banner"></div>
  <div class="main-info">
    <h1>Насладись прогулкой в горах с командой единомышленников</h1>
    <div class="main-info-table">
      <div class="center-table">
        <div>
          <div class="location-info">
            <span class="text-location-info">Локация для тура</span>
            <div class="info-list">
              <img src="/images/arrow-down-icon.svg">
            </div>
          </div>
          <span class="text-info-table">выберите локацию</span>
        </div>
        <div>
          <div class="location-info">
            <span class="text-location-info">Дата похода</span>
            <div class="info-list">
              <img src="/images/formkit-date-icon.svg">
            </div>
          </div>
          <span class="text-info-table">укажите дату</span>
        </div>
        <div>
          <div class="location-info">
            <span class="text-location-info">Участники</span>
            <div class="info-list">
              <img src="/images/arrow-down-icon.svg">
            </div>
          </div>
          <span class="text-info-table">выберите из списка</span>
        </div>
        <button class="search-programm-btn">Найти программу</button>
      </div>
    </div>
  </div>
</section>
