<header class="header">
  <div class="main-header">
    <div class="header-container">
      <div class="company-logo">
        <a href="">
          <img class="vector-image" src="/images/vector-icon.svg" alt="">
          <img class="name-image" src="/images/name-icon.svg" alt="">
        </a>
      </div>
      <nav class="navigator">
        <ul>
          <li><a href="">Главная</a></li>
          <li><a href="">Про гида</a></li>
          <li><a href="">Программа тура</a></li>

<section class="find-program">
  <div class="banner"> </div>
  <div class="title">
    <h1 class="title-name">
      Насладись прогулкой в горах
      <br> с командой единомышленников
    </h1>
  </div>

  <div class="data-container">
    <div class="fill-data">
      <div class="input-wrapper">
        <input class="location" type="text" id="location" placeholder="Локация для тура">
        <label class="describe-action" for="location">выберите из списка</label>
      </div>

      <div class="input-wrapper">
        <input class="calendar" type="text" id="calendar" placeholder="Дата похода">
        <label class="describe-action" for="calendar">укажите дату</label>
      </div>

      <div class="input-wrapper">
        <input class="participants" type="text" id="participants" placeholder="Участники">
        <label class="describe-action" for="participants">выберите из списка</label>
      </div>

      <button class="search-button">Найти программу</button>
    </div>
  </div>
</section>
