<header class="header">
  <div class="main-header">
    <div class="header-container">
      <div class="company-logo">
        <a href="">
          <img class="vector-image" src="/images/vector-icon.svg" alt="">
          <img class="name-image" src="/images/name-icon.svg" alt="">
        </a>
      </div>
      <nav class="navigator">
        <ul>
          @for (link of navLinks; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
              {{ link.label }}
            </a>
          </li>
          }
        </ul>
      </nav>
      <div class="right-side-actions">
        <button class="consultation-button">Консультация</button>
        <div class="tasks-dropdown">
          @if (taskFour) {
          <div class="header-timer">{{ currentDateTime }}</div>
          }
          @else {
          <div class="click">
            <button [disabled]="clickCount === 0" (click)="decrement()">-</button>
            <button>{{ clickCount }}</button>
            <button (click)="increment()">+</button>
          </div>
          }
          <button (click)="toggleTask()" [ngClass]="taskFour ? 'task-four' : 'task-five'">
            поменять
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
