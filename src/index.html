<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>angular-simulator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="logotype.png">
</head>
  <body>
    <header class="header"> 
      <div class="container"> 
        <a href="#" class="logo">РУМТИБЕТ</a> 
        <nav class="menu"> 
          <ul> 
            <li><a href="#">Главная</a></li> 
            <li><a href="#">Про гида</a></li> 
            <li><a href="#">Программа тура</a></li> 
            <li><a href="#">Стоимость</a></li> 
            <li><a href="#">Блог</a></li> 
            <li><a href="#">Контакты</a></li> 
          </ul> 
        </nav> 
        <button class="btn-consultation">Консультация</button> </div> </header> 
        <section class="hero"> 
          <div class="overlay"></div> 
          <h1 class="hero-title">Насладись прогулкой в горах<br>с командой единомышленников</h1> 
          <form action="#" class="search-form"> 
            <div class="form-group"> 
              <label for="location">Локация для тура</label> 
              <select id="location" name="location"> 
                <option value="" disabled selected>Выберите из списка...</option> 
              </select> 
            </div> 
            <div class="form-group"> 
              <label for="date">Дата похода</label> 
              <input type="date" id="date" name="date" placeholder="Укажите дату"> 
            </div> 
            <div class="form-group"> 
              <label for="participants">Участники</label> 
              <select id="participants" name="participants"> 
                <option value="" disabled selected>Выберите из списка...</option> 
              </select> 
            </div> 
            <button type="submit" class="btn-search">Найти программу</button> 
          </form> 
        </section>
        <link rel="stylesheet" href="src/style.css">
  </body>
 </html>
